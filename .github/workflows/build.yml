name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MapIME.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle -p MapIME assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MapIME-apk
          path: MapIME/app/build/outputs/apk/debug/*.apk
